name: Research software regression
on:
  push:
    branches:
      - feat/feature-pipeline-grouped-baselines-shadow-20261009
    paths:
      - 'software/analysis/**'
      - 'software/modeling/**'
      - 'software/decision/**'
      - 'software/tests/**'
      - '.github/workflows/research-software.yml'
  pull_request:
    paths:
      - 'software/analysis/**'
      - 'software/modeling/**'
      - 'software/decision/**'
      - 'software/tests/**'
      - '.github/workflows/research-software.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML -r software/modeling/requirements.txt
      - run: python -m unittest discover -s software/tests -v
