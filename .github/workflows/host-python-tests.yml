name: Host application tests

on:
  push:
    branches: [main]
    paths:
      - 'software/host_mvp/**'
      - '.github/workflows/host-python-tests.yml'
  pull_request:
    paths:
      - 'software/host_mvp/**'
      - '.github/workflows/host-python-tests.yml'
      - 'README.md'
      - 'docs/GETTING_STARTED.md'

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install host dependencies
        run: python -m pip install -r software/host_mvp/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q software/host_mvp
      - name: Run host regression tests
        run: python -m unittest discover -s software/host_mvp -p 'test_*.py' -v
